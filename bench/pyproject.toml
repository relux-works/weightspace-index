[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weightspace-bench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["lm_eval[api,math]==0.4.13", "huggingface_hub>=0.30,<3", "safetensors>=0.5,<1", "torch>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["bench"]
package-dir = {bench = "."}

[tool.setuptools.package-data]
bench = ["config.json", "data/*.json"]
