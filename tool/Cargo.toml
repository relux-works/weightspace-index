[package]
name = "weightspace-tools"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
default-run = "weightspace"
publish = false
license = "MIT"
description = "Checks, generator, patch tools, multi-registry client and TUI for the Weightspace Index"

[[bin]]
name = "weightspace"
path = "src/main.rs"

[[bin]]
name = "wsp"
path = "src/bin/wsp.rs"

[dependencies]
# No default features: the validator never fetches remote or file references.
jsonschema = { version = "0.61", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Slice 1 tooling: official safetensors read/write types, typed CLI, typed
# errors. All fit rust-version 1.85; exact pins live in Cargo.lock.
safetensors = "0.8.0"
# Snapshot-backed official reader: maps only private snapshot copies of
# inputs (see tool/src/snapshot.rs). MSRV 1.65 fits rust-version 1.85.
memmap2 = "0.9.12"
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
thiserror = "2"
# Client, multi-registry config, HTTP downloads (pure-Rust rustls, no OpenSSL), and TUI.
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
mod_module_files = "warn"
