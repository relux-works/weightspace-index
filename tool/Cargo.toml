[package]
name = "weightspace-tools"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Checks and generator for the Weightspace Index"

[[bin]]
name = "weightspace"
path = "src/main.rs"

[dependencies]
# No default features: the validator never fetches remote or file references.
jsonschema = { version = "0.61", default-features = false }
regex = "1"
serde_json = "1"
sha2 = "0.11"
# Slice 1 tooling: official safetensors read/write types, typed CLI, typed
# errors. All fit rust-version 1.85; exact pins live in Cargo.lock.
safetensors = "0.8.0"
# Snapshot-backed official reader: maps only private snapshot copies of
# inputs (see tool/src/snapshot.rs). MSRV 1.65 fits rust-version 1.85.
memmap2 = "0.9.12"
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
mod_module_files = "warn"
