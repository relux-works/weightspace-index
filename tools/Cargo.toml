[package]
name = "weightspace-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Checks for the Weightspace Index records and layout"

[dependencies]
# No default features: the validator never fetches remote or file references.
jsonschema = { version = "0.61", default-features = false }
regex = "1"
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
