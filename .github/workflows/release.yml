name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          # Optional for v0.1.0; enable when owners want them:
          # - target: aarch64-unknown-linux-musl
          #   os: ubuntu-24.04-arm
          #   archive: tar.gz
          # - target: x86_64-apple-darwin
          #   os: macos-latest
          #   archive: tar.gz
          # - target: aarch64-pc-windows-msvc
          #   os: windows-11-arm
          #   archive: zip
    steps:
      # Pinned to the v7.0.1 commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Pinned to the v2.9.3 commit of Swatinem/rust-cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: tool

      - name: Install target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # musl targets are static by default; the MSVC CRT is made
      # static with +crt-static so the .exe needs no redistributable.
      - name: Build
        working-directory: tool
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --locked --release --target ${{ matrix.target }} --bin weightspace

      - name: Package
        shell: bash
        run: |
          stage="weightspace-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$stage"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp "tool/target/${{ matrix.target }}/release/weightspace.exe" "$stage/"
          else
            cp "tool/target/${{ matrix.target }}/release/weightspace" "$stage/"
          fi
          cp tool/LICENSE "$stage/"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$stage.zip" "$stage"
            artifact="$stage.zip"
          else
            tar -czf "$stage.tar.gz" "$stage"
            artifact="$stage.tar.gz"
          fi
          # The same binary, unpacked, so it runs straight after download.
          if [ "${{ matrix.archive }}" = zip ]; then
            binary="$stage.exe"
            cp "$stage/weightspace.exe" "$binary"
          else
            # Named like the archive without its extension; the staging
            # folder holds that name, so it goes once the archive exists.
            binary="$stage"
            cp "$stage/weightspace" weightspace.tmp
            rm -rf "$stage"
            mv weightspace.tmp "$binary"
            chmod +x "$binary"
          fi
          for f in "$artifact" "$binary"; do
            sha256sum "$f" > "$f.sha256" || shasum -a 256 "$f" > "$f.sha256"
          done
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"
          echo "BINARY=$binary" >> "$GITHUB_ENV"

      # Pinned to the v4.6.2 commit.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
            ${{ env.BINARY }}
            ${{ env.BINARY }}.sha256
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Pinned to the v7.0.1 commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Pinned to the v4.3.0 commit.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true

      - name: Combined checksums
        shell: bash
        run: |
          cd artifacts
          cat ./*.sha256 > SHA256SUMS.tmp
          sort SHA256SUMS.tmp > SHA256SUMS
          rm SHA256SUMS.tmp ./*.sha256
          ls -l
          cat SHA256SUMS

      # Pinned to the v4.2.2 commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*-apple-darwin
            artifacts/*-linux-musl
            artifacts/*.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --title "weightspace ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag

      # The site's /weightspace/ page reads this file for its download
      # links and install commands; the site-release job commits it.
      - name: Site release record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' tool/Cargo.toml | head -n 1)
          published=$(gh release view "$TAG" --json publishedAt --jq '.publishedAt[0:10]')
          file() { # name -> {name, size, sha256}, from the published files
            sha=$(awk -v f="$1" '$2 == f || $2 == "*" f { print $1 }' artifacts/SHA256SUMS)
            [ -n "$sha" ] || { echo "no checksum for $1" >&2; exit 1; }
            jq -n --arg name "$1" --argjson size "$(stat -c %s "artifacts/$1")" --arg sha256 "$sha" '{$name, $size, $sha256}'
          }
          entry() { # target os label arch archive-extension binary-suffix
            stage="weightspace-$TAG-$1"
            jq -n --arg target "$1" --arg os "$2" --arg label "$3" --arg arch "$4" \
              --argjson archive "$(file "$stage.$5")" --argjson binary "$(file "$stage$6")" \
              '{$target, $os, $label, $arch} + $archive + {$binary}'
          }
          # The first entry is the page's download button when it cannot
          # tell the visitor's platform.
          {
            entry aarch64-apple-darwin macos macOS "Apple Silicon" tar.gz ""
            entry x86_64-unknown-linux-musl linux Linux x86_64 tar.gz ""
            entry x86_64-pc-windows-msvc windows Windows x86_64 zip .exe
          } | jq -s --arg tag "$TAG" --arg toolVersion "$version" --arg published "$published" \
            '{$tag, $toolVersion, $published, assets: .}' > tool-release.json
          cat tool-release.json

      # Pinned to the v4.6.2 commit.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-release
          path: tool-release.json
          if-no-files-found: error

  # Points the site at the release just published by committing the record
  # to main. A tag cut from an older commit than the recorded one still
  # moves the page to it, so tag releases in order.
  site-release:
    name: site release record
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to the v7.0.1 commit. Keeps the token so the job can push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      # Pinned to the v4.3.0 commit.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: site-release
          path: site-release

      - name: Commit to main
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp site-release/tool-release.json site/src/data/tool-release.json
          rm -rf site-release
          if git diff --quiet; then
            echo "site/src/data/tool-release.json already records $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Point the tool page at weightspace $TAG" site/src/data/tool-release.json
          git push origin HEAD:main
