name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, lane: linux, required: linux }
          - { os: ubuntu-latest, lane: linux-symlinked-tmp, required: linux }
          - { os: macos-latest, lane: macos, required: macos }
          - { os: windows-latest, lane: windows, required: windows }
    defaults:
      run:
        working-directory: tool
    steps:
      # Pinned to the v7.0.1 commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          valid_sha() {
            [[ "$1" =~ ^[0-9a-fA-F]{40}$ && ! "$1" =~ ^0+$ ]]
          }
          range=
          case "$EVENT_NAME" in
            pull_request)
              if valid_sha "$PR_BASE" && valid_sha "$PR_HEAD"; then
                range="$PR_BASE...$PR_HEAD"
              else
                range='HEAD^1..HEAD'
              fi
              ;;
            push)
              if valid_sha "$PUSH_BEFORE"; then
                range="$PUSH_BEFORE..HEAD"
              else
                range='HEAD^..HEAD'
              fi
              ;;
          esac

          # Unavailable or empty diffs must never silently skip validation.
          code=true
          records=true
          paths=$(mktemp)
          trap 'rm -f "$paths"' EXIT
          # Disable rename detection so both the old and new paths are checked.
          if [[ -n "$range" ]] && git diff --name-only --no-renames -z "$range" -- > "$paths" && [[ -s "$paths" ]]; then
            code=false
            records=false
            while IFS= read -r -d '' path; do
              case "$path" in
                tool/*|.github/workflows/checks.yml|.gitattributes|.gitignore)
                  code=true
                  records=true
                  ;;
                models/*|lookup/*|docs/example/*|schema/*)
                  records=true
                  ;;
              esac
            done < "$paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "records=$records" >> "$GITHUB_OUTPUT"

      # Pinned to the v2.9.3 commit of Swatinem/rust-cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.changes.outputs.code == 'true'
        with:
          workspaces: tool

      # The macOS-shape proxy: TMPDIR spelled through a symlink
      # ($RUNNER_TEMP/tmp -> private/tmp), as macOS spells its
      # default temp root through /var -> private/var.
      - name: Symlinked temp root
        if: steps.changes.outputs.code == 'true' && matrix.lane == 'linux-symlinked-tmp'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/private/tmp"
          ln -s "$RUNNER_TEMP/private/tmp" "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - name: Formatting
        if: steps.changes.outputs.code == 'true' && matrix.lane == 'linux'
        run: cargo fmt --check

      # Every lane: clippy compiles each OS's cfg-gated code.
      - name: Clippy
        if: steps.changes.outputs.code == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings

      # Schema, layout, cross-references, digests of files hosted here,
      # no symlinks or case collisions, for docs/example/ and models/.
      - name: Records and layout
        if: steps.changes.outputs.records == 'true'
        run: cargo test --locked

      # No required test may silently vanish: every name in the
      # per-OS list under tool/tests/required/ must be compiled
      # into a test binary on this OS.
      - name: Required tests present
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          cargo test --locked -- --list --format terse 2>/dev/null | sed 's/: test$//' | sort > listed.txt
          sort "tests/required/${{ matrix.required }}.txt" > required.txt
          missing=$(comm -23 required.txt listed.txt)
          if [ -n "$missing" ]; then
            echo "required tests not compiled on this OS:"
            echo "$missing"
            exit 1
          fi

      # Every offline check over the repository and docs/example/, and every
      # generated file equal to a fresh build.
      - name: Generated files in sync
        if: steps.changes.outputs.records == 'true' && matrix.lane == 'linux'
        run: cargo run --locked -- check ..

      # Rule 5: before adoption, merged version files may be edited in place.
      # Deletions and type changes stay forbidden; additions remain allowed.
      # Set PRE_ADOPTION to 'false' when adoption begins to forbid edits too.
      # Legal takedowns remain an admin exception.
      - name: Merged versions follow adoption policy
        working-directory: .
        if: github.event_name == 'pull_request' && matrix.lane == 'linux'
        env:
          PRE_ADOPTION: 'true'
        run: |
          changed=$(git diff --name-status --no-renames HEAD^1 HEAD -- models \
            | awk -F'\t' -v pre_adoption="$PRE_ADOPTION" '$1 != "A" && !(pre_adoption == "true" && $1 == "M") && $2 ~ /^models\/[^\/]+\/[^\/]+\/[^\/]+\/v[0-9]+\//')
          if [ -n "$changed" ]; then
            echo "Changes forbidden by the version adoption policy:"
            echo "$changed"
            exit 1
          fi
